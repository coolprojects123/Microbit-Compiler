<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Micro:bit Compiler Studio</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
    <link rel="stylesheet" href="vendor/xterm.min.css">
    <style>
        :root {
            --bg: #0a0c13;
            --panel: #0e111b;
            --border: #262b40;
            --hover: #171b2b;
            --text: #d6dbf0;
            --dim: #7a7f9e;
            --green: #6dd47e;
            --blue: #4cafef;
            --yellow: #ffa500;
            --red: #ff5c5c;
            --mono: "JetBrains Mono", "Cascadia Mono", "Fira Code", Consolas, monospace;
        }

        * { box-sizing: border-box; }
        html, body { height: 100%; margin: 0; }

        body {
            display: flex;
            font: 12.5px/1.5 var(--mono);
            color: var(--text);
            background: var(--bg);
            -webkit-font-smoothing: antialiased;
        }

        ::-webkit-scrollbar { width: 10px; height: 10px; }
        ::-webkit-scrollbar-thumb { background: var(--border); }
        ::-webkit-scrollbar-track { background: transparent; }

        .material-icons { font-size: 18px; line-height: 1; flex-shrink: 0; user-select: none; }

        /* ---------- buttons ---------- */
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            height: 30px;
            padding: 0 12px;
            border: 1px solid var(--border);
            border-radius: 3px;
            background: transparent;
            color: var(--text);
            font: inherit;
            cursor: pointer;
            white-space: nowrap;
        }
        .btn:hover { background: var(--hover); border-color: var(--dim); }
        .btn:focus-visible { outline: 1px solid var(--blue); outline-offset: 1px; }
        .btn.primary { color: var(--bg); background: var(--green); border-color: var(--green); font-weight: 700; }
        .btn.primary:hover { filter: brightness(1.1); }
        .btn.danger { color: var(--red); }
        .btn.small { height: 24px; padding: 0 8px; font-size: 12px; }
        .btn.small .material-icons { font-size: 16px; }

        /* ---------- sidebar ---------- */
        #sidebar {
            width: 180px;
            flex-shrink: 0;
            background: var(--panel);
            border-right: 1px solid var(--border);
        }
        .brand { padding: 14px 16px; border-bottom: 1px solid var(--border); }
        .brand-name { color: var(--green); font-weight: 700; }
        .brand-sub { color: var(--dim); }

        .nav { padding: 8px; display: flex; flex-direction: column; gap: 2px; }
        .nav-btn {
            display: flex;
            align-items: center;
            gap: 10px;
            height: 32px;
            padding: 0 10px;
            border: none;
            border-left: 2px solid transparent;
            background: transparent;
            color: var(--dim);
            font: inherit;
            cursor: pointer;
        }
        .nav-btn:hover { background: var(--hover); color: var(--text); }
        .nav-btn.active { background: var(--hover); color: var(--green); border-left-color: var(--green); }

        /* ---------- main ---------- */
        #main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
        #content { flex: 1; min-height: 0; display: flex; padding: 12px; }
        .content-section { display: none; flex: 1; min-width: 0; gap: 12px; }
        .content-section.active { display: flex; }
        #editor-view { flex-direction: column; }

        /* ---------- panels ---------- */
        .panel {
            display: flex;
            flex-direction: column;
            min-height: 0;
            border: 1px solid var(--border);
            border-radius: 4px;
            background: var(--panel);
            overflow: hidden;
        }
        .panel.fill { flex: 1; }
        .panel-head {
            display: flex;
            justify-content: space-between;
            align-items: center;
            min-height: 34px;
            padding: 2px 8px 2px 14px;
            border-bottom: 1px solid var(--border);
            color: var(--dim);
            font-size: 11.5px;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }
        .panel-body { padding: 14px; }

        .toolbar { flex-direction: row; align-items: center; gap: 10px; padding: 8px 10px; }
        #file-info {
            flex: 1;
            min-width: 0;
            display: flex;
            align-items: center;
            gap: 8px;
            height: 30px;
            padding: 0 10px;
            border: 1px solid var(--border);
            border-radius: 3px;
            background: var(--bg);
            color: var(--dim);
        }
        #file-name-display { color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        #file-size { margin-left: auto; white-space: nowrap; }

        /* ---------- console ---------- */
        #status { flex: 1; min-height: 0; overflow: hidden; background: var(--bg); }
        #status .xterm { padding: 8px 12px; height: 100%; }
        #status .xterm-viewport { background-color: transparent !important; }

        /* ---------- history ---------- */
        .history-list { width: 300px; flex-shrink: 0; }
        .history-detail { flex: 1; min-width: 0; }
        #build-history { flex: 1; overflow: auto; }

        .build-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 12px;
            border-bottom: 1px solid var(--border);
            border-left: 2px solid transparent;
            cursor: pointer;
        }
        .build-item:hover { background: var(--hover); }
        .build-item.selected { background: var(--hover); border-left-color: var(--green); }
        .build-item-icon { color: var(--dim); display: flex; }
        .build-item.selected .build-item-icon { color: var(--green); }
        .build-item-content { min-width: 0; }
        .build-item-name { word-break: break-all; }
        .build-item-time { color: var(--dim); font-size: 11.5px; }

        #build-viewer { display: flex; flex-direction: column; flex: 1; min-height: 0; }
        .build-viewer-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            padding-bottom: 10px;
            margin-bottom: 10px;
            border-bottom: 1px solid var(--border);
        }
        .build-viewer-title { color: var(--yellow); word-break: break-all; }
        .build-viewer-actions { display: flex; gap: 6px; flex-shrink: 0; }

        .build-file-area { display: flex; gap: 10px; flex: 1; min-height: 0; }
        .build-file-list {
            width: 200px;
            flex-shrink: 0;
            overflow: auto;
            border: 1px solid var(--border);
            border-radius: 3px;
            background: var(--bg);
        }
        .build-file { padding: 4px 10px; color: var(--dim); cursor: pointer; word-break: break-all; }
        .build-file:hover { background: var(--hover); color: var(--text); }
        .build-file-content {
            flex: 1;
            min-width: 0;
            overflow: auto;
            padding: 10px 12px;
            border: 1px solid var(--border);
            border-radius: 3px;
            background: var(--bg);
            line-height: 1.55;
            white-space: pre-wrap;
            word-break: break-all;
        }

        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 28px 16px;
            color: var(--dim);
            text-align: center;
        }
        .empty-state .material-icons { font-size: 32px; opacity: 0.7; }

        /* ---------- status bar ---------- */
        #statusbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            height: 28px;
            padding: 0 14px;
            border-top: 1px solid var(--border);
            background: var(--panel);
            color: var(--dim);
            font-size: 12px;
        }
        #build-meta { display: flex; align-items: center; gap: 8px; }
        #build-meta::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--dim); }
        #build-meta[data-state="busy"] { color: var(--yellow); }
        #build-meta[data-state="busy"]::before { background: var(--yellow); }
        #build-meta[data-state="ok"] { color: var(--green); }
        #build-meta[data-state="ok"]::before { background: var(--green); }
        #build-meta[data-state="error"] { color: var(--red); }
        #build-meta[data-state="error"]::before { background: var(--red); }

        #progress-container { width: 180px; height: 4px; background: var(--border); overflow: hidden; }
        #progress-bar { width: 0; height: 100%; background: var(--green); }

        /* ---------- approval modal ---------- */
        .modal-overlay {
            position: fixed;
            inset: 0;
            display: none;
            align-items: center;
            justify-content: center;
            background: rgba(5, 6, 10, 0.7);
            z-index: 1000;
        }
        .modal-overlay.open { display: flex; }
        .modal-box {
            width: min(430px, calc(100vw - 32px));
            border: 1px solid var(--dim);
            border-radius: 4px;
            background: var(--panel);
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
        }
        .modal-message { margin-bottom: 6px; font-size: 14px; }
        .modal-detail { color: var(--dim); }
        .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 18px; }
    </style>
</head>
<body>
    <aside id="sidebar">
        <div class="brand">
            <div class="brand-name">micro:bit</div>
            <div class="brand-sub">compiler studio</div>
        </div>

        <nav class="nav">
            <button class="nav-btn active" data-view="editor">
                <span class="material-icons">terminal</span>Build
            </button>
            <button class="nav-btn" data-view="history">
                <span class="material-icons">history</span>History
            </button>
        </nav>
    </aside>

    <div id="main">
        <main id="content">

            <!-- BUILD -->
            <section class="content-section active" id="editor-view">
                <div class="panel toolbar">
                    <button class="btn" id="select">
                        <span class="material-icons">folder_open</span>Choose file
                    </button>

                    <div id="file-info">
                        <span class="material-icons">description</span>
                        <span id="file-name-display">No file selected</span>
                        <span id="file-size"></span>
                    </div>

                    <button class="btn" id="toolbar-flash">
                        <span class="material-icons">bolt</span>Flash
                    </button>
                    <button class="btn primary" id="toolbar-build">
                        <span class="material-icons">play_arrow</span>Build
                    </button>
                </div>

                <div class="panel fill">
                    <div class="panel-head">
                        <span>Output</span>
                        <button class="btn small" id="console-clear">
                            <span class="material-icons">delete_sweep</span>Clear
                        </button>
                    </div>
                    <div id="status"></div>
                </div>
            </section>

            <!-- HISTORY -->
            <section class="content-section" id="history-view">
                <div class="panel history-list">
                    <div class="panel-head"><span>Builds</span></div>
                    <div id="build-history"></div>
                </div>

                <div class="panel history-detail">
                    <div class="panel-head"><span>Details</span></div>
                    <div class="panel-body" id="build-viewer">
                        <div class="empty-state">
                            <span class="material-icons">inventory_2</span>
                            <div>Select a build to view its files.</div>
                        </div>
                    </div>
                </div>
            </section>

        </main>

        <footer id="statusbar">
            <span id="build-meta" data-state="idle">Ready</span>
            <div id="progress-container"><div id="progress-bar"></div></div>
        </footer>
    </div>

    <!-- APPROVAL MODAL -->
    <div id="approval-modal" class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="approval-title">
        <div class="modal-box">
            <div class="panel-head" id="approval-title">Tool required</div>
            <div class="panel-body">
                <div class="modal-message" id="approval-message"></div>
                <div class="modal-detail" id="approval-detail"></div>
                <div class="modal-actions">
                    <button class="btn" id="approval-cancel">Cancel</button>
                    <button class="btn primary" id="approval-confirm">Install</button>
                </div>
            </div>
        </div>
    </div>

    <script src="api-shim.js"></script>
    <script src="vendor/xterm.min.js"></script>
    <script src="vendor/addon-fit.min.js"></script>
    <script src="renderer.js"></script>
</body>
</html>
