[package]
name = "microbit-compiler"
version = "0.1.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "fs", "io-util", "macros", "rt-multi-thread"] }
reqwest = { version = "0.12", default-features = false, features = ["stream", "rustls-tls"] }
futures-util = "0.3"
which = "6"
zip = "2"
tar = "0.4"
xz2 = { version = "0.1", features = ["static"] } # vendors liblzma so Windows/Linux builds don't need a system copy
flate2 = "1"
dirs = "5"
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[[bin]]
name = "microbit-compiler"
path = "src/main.rs"
