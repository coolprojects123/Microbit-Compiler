name: Build Pipeline

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Cache Rust
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: windows-rust-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            windows-rust-

      - name: Install dependencies
        run: npm install

      # The cache restores src-tauri/target, including installers from older
      # builds. Wipe them so only this build's bundles get uploaded.
      - name: Clean old bundles
        shell: bash
        run: rm -rf src-tauri/target/release/bundle

      # createUpdaterArtifacts is on, so every build must be able to sign.
      - name: Build Tauri app
        run: npm run build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: microbit-compiler-windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.exe.sig
            src-tauri/target/release/bundle/msi/*.msi
          compression-level: 9

  build-linux:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Cache Rust
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: linux-rust-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            linux-rust-

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install dependencies
        run: npm install

      # The cache restores src-tauri/target, including installers from older
      # builds. Wipe them so only this build's bundles get uploaded.
      - name: Clean old bundles
        shell: bash
        run: rm -rf src-tauri/target/release/bundle

      # createUpdaterArtifacts is on, so every build must be able to sign.
      - name: Build Tauri app
        run: npm run build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: microbit-compiler-linux
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/appimage/*.AppImage.sig
          compression-level: 9

  release:
    needs:
      - build-windows
      - build-linux

    if: startsWith(github.ref, 'refs/tags/v')

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # If the tag and the app version disagree, installed apps would keep
      # seeing the same "new" version forever.
      - name: Verify tag matches app version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          APP_VERSION=$(jq -r .version src-tauri/tauri.conf.json)
          if [ "v$APP_VERSION" != "$TAG" ]; then
            echo "Tag $TAG does not match tauri.conf.json version $APP_VERSION"
            exit 1
          fi

      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: microbit-compiler-windows
          path: release-files/windows

      - name: Download Linux artifacts
        uses: actions/download-artifact@v4
        with:
          name: microbit-compiler-linux
          path: release-files/linux

      # GitHub rewrites spaces in asset names to dots, which would break the
      # URLs in latest.json, so normalise names first. Signatures cover file
      # contents, not names, so renaming the .sig alongside is safe.
      - name: Normalise file names
        run: |
          find release-files -type f -name '* *' -print0 | while IFS= read -r -d '' f; do
            mv "$f" "$(dirname "$f")/$(basename "$f" | tr ' ' '-')"
          done

      - name: Generate latest.json
        env:
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          VERSION="${TAG#v}"
          BASE="https://github.com/$REPO/releases/download/$TAG"

          WIN=$(find release-files/windows -type f -name "*_${VERSION}_*-setup.exe" | head -n1)
          LIN=$(find release-files/linux -type f -name "*_${VERSION}_*.AppImage" | head -n1)
          for f in "$WIN" "$WIN.sig" "$LIN" "$LIN.sig"; do
            [ -f "$f" ] || { echo "Missing updater file: $f"; exit 1; }
          done

          jq -n \
            --arg version "$VERSION" \
            --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg wsig "$(cat "$WIN.sig")" \
            --arg wurl "$BASE/$(basename "$WIN")" \
            --arg lsig "$(cat "$LIN.sig")" \
            --arg lurl "$BASE/$(basename "$LIN")" \
            '{
              version: $version,
              notes: "",
              pub_date: $date,
              platforms: {
                "windows-x86_64": { signature: $wsig, url: $wurl },
                "linux-x86_64":   { signature: $lsig, url: $lurl }
              }
            }' > release-files/latest.json

          cat release-files/latest.json

      - name: Show release files
        run: |
          echo "Files to upload:"
          find release-files -type f -print

      - name: Create or update draft release with notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          NOTES_FILE="RELEASE_NOTES.md"
          if [ ! -f "$NOTES_FILE" ]; then
            cat > "$NOTES_FILE" <<EOF
# Microbit Compiler $TAG

## Highlights
- Modernized desktop UI for faster project setup and cleaner workflows
- Improved example selection and build history management
- Added theme and app settings controls for a more polished experience
- Fixed MakeCode Bluetooth and Radio dependency conflicts
- Improved platform build reliability for Windows and Linux releases
EOF
          fi

          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release edit "$TAG" \
              --repo "$REPO" \
              --title "Microbit Compiler $TAG" \
              --notes-file "$NOTES_FILE"
          else
            gh release create "$TAG" \
              --repo "$REPO" \
              --draft \
              --title "Microbit Compiler $TAG" \
              --notes-file "$NOTES_FILE"
          fi

      # NOTE: releases/latest/download/latest.json only resolves once this
      # draft is PUBLISHED. Installed apps won't see the update until then.
      - name: Upload installers to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          find release-files -type f -print0 | \
            xargs -0 gh release upload "$TAG" \
              --repo "$REPO" \
              --clobber