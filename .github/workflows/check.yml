name: Check and cleanup

on:
  push:
    branches:
      - main
      - master
    tags-ignore:
      - "v*"

jobs:
  cleanup-release-notes:
    if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Remove release notes for non-release pushes
        shell: bash
        run: |
          if [ -f RELEASE_NOTES.md ]; then
            rm -f RELEASE_NOTES.md
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "chore: remove release notes for non-release push" || echo "No release notes to remove"
            git push
          else
            echo "No release notes file present"
          fi
